name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - '3.0.1'
          - '3.1.2'
          - '3.2.1'
        db-adapter:
          - 'mysql2'
          - 'trilogy'
    env:
      DB_DATABASE: workhorse
      DB_USER: root
      DB_PASSWORD: 'root'
      DB_HOST: localhost
      DB_ADAPTER: ${{ matrix.db-adapter }}

    steps:
      - uses: actions/checkout@v2
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Startup database
        run: |
          sudo /etc/init.d/mysql start
          mysql -u${{ env.DB_USER }} -p${{ env.DB_PASSWORD }} -e 'CREATE DATABASE ${{ env.DB_DATABASE }};'
      - name: Run rake tests
        uses: nick-fields/retry@v2
        with:
          # Not much above what one run takes on a loaded runner.
          timeout_seconds: 300
          retry_on: any
          max_attempts: 3
          command: bundle exec rake test TESTOPTS='--verbose'
          # A timed-out attempt leaves its daemon workers running - they call
          # setsid, so killing the attempt does not reach them - and the next
          # attempt then hangs in the daemon tests against them and their
          # pidfiles. Clear both before retrying.
          on_retry_command: |
            pkill -f "^Workhorse .*: $GITHUB_WORKSPACE" || true
            pkill -f "[I]lib:test/lib" || true
            sleep 1
            rm -f tmp/pids/*

  test-oracle:
    runs-on: ubuntu-latest

    # Oracle gets a job of its own rather than a matrix entry: it needs a
    # service container and the Instant Client, and it is run against a single
    # Ruby version, as what is being covered is the database dialect rather
    # than the interpreter.
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: workhorse
          APP_USER_PASSWORD: workhorse
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 20s
          --health-timeout 10s
          --health-retries 30

    env:
      DB_ADAPTER: oracle_enhanced
      DB_NAME: FREEPDB1
      DB_USERNAME: workhorse
      DB_PASSWORD: workhorse
      DB_HOST: localhost
      DB_PORT: 1521
      LD_LIBRARY_PATH: /opt/oracle/instantclient

    steps:
      - uses: actions/checkout@v2

      # ruby-oci8 compiles against the Instant Client, so both the runtime
      # library and the SDK headers are needed; basiclite alone does not carry
      # oci.h.
      - name: Install Oracle Instant Client
        run: |
          sudo apt-get update
          # The package was renamed in Ubuntu 24.04, which `ubuntu-latest` now
          # is; keep working on both.
          sudo apt-get install -y unzip
          sudo apt-get install -y libaio1 || sudo apt-get install -y libaio1t64
          # The rename came with a soname change to libaio.so.1t64, while the
          # Oracle client still links against libaio.so.1. Without this the
          # client library cannot be linked, and ruby-oci8's version probe
          # fails with a TypeError that says nothing about the cause.
          if ! ldconfig -p | grep -qE 'libaio\.so\.1$|libaio\.so\.1 '; then
            t64=$(ls /usr/lib/*/libaio.so.1t64 2>/dev/null | head -1)
            if [ -n "$t64" ]; then sudo ln -sfn "$t64" "$(dirname "$t64")/libaio.so.1"; fi
          fi
          sudo mkdir -p /opt/oracle
          cd /tmp
          # Pinned to 21.13 rather than taking the current release: ruby-oci8
          # 2.2 fails its `OCI_MAJOR_VERSION` probe against an Instant Client
          # 23 header, after finding the library and the SDK correctly. A 21
          # client talks to the 23 server used below.
          base=https://download.oracle.com/otn_software/linux/instantclient/2113000
          curl -sSLO $base/instantclient-basiclite-linux.x64-21.13.0.0.0dbru.zip
          curl -sSLO $base/instantclient-sdk-linux.x64-21.13.0.0.0dbru.zip
          sudo unzip -oq 'instantclient-basiclite-linux.x64-*.zip' -d /opt/oracle
          sudo unzip -oq 'instantclient-sdk-linux.x64-*.zip' -d /opt/oracle
          # The archives unpack into a versioned directory, whose name changes
          # with every release; the fixed symlink is what LD_LIBRARY_PATH and
          # the ruby-oci8 build both point at.
          sudo ln -sfn "$(find /opt/oracle -maxdepth 1 -type d -name 'instantclient_*' | head -1)" /opt/oracle/instantclient
          # The basiclite package ships only the versioned libraries, and
          # linking a conftest against -lclntsh needs the unversioned name.
          cd /opt/oracle/instantclient
          for lib in libclntsh libocci; do
            versioned=$(ls $lib.so.* 2>/dev/null | head -1)
            if [ -n "$versioned" ]; then sudo ln -sfn "$versioned" "$lib.so"; fi
          done
          echo /opt/oracle/instantclient | sudo tee /etc/ld.so.conf.d/oracle-instantclient.conf
          sudo ldconfig

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.1'

      - name: Install bundle including the oracle group
        run: |
          bundle config set --local with oracle
          bundle install --jobs 4 --retry 3

      # extconf.rb only says to consult mkmf.log, which is otherwise lost with
      # the runner.
      - name: Show the native extension build log
        if: failure()
        run: find / -name mkmf.log -path '*ruby-oci8*' -exec cat {} +

      # The global lock is DBMS_LOCK on Oracle, and execute permission on that
      # package is not granted to a new schema by default. SYS owns the
      # package, and only it can grant it, so this connects as SYSDBA.
      - name: Grant DBMS_LOCK to the test schema
        run: |
          bundle exec ruby -e '
            require "active_record"
            require "active_record/connection_adapters/oracle_enhanced_adapter"
            ActiveRecord::Base.establish_connection(
              adapter: "oracle_enhanced", database: "FREEPDB1",
              username: "sys", password: "oracle", privilege: "SYSDBA",
              host: "localhost", port: 1521
            )
            ActiveRecord::Base.connection.execute("GRANT EXECUTE ON DBMS_LOCK TO workhorse")
          '

      - name: Run rake tests
        uses: nick-fields/retry@v2
        with:
          timeout_seconds: 600
          retry_on: any
          max_attempts: 3
          command: bundle exec rake test TESTOPTS='--verbose'
          # A timed-out attempt leaves its daemon workers running - they call
          # setsid, so killing the attempt does not reach them - and the next
          # attempt then hangs in the daemon tests against them and their
          # pidfiles. Clear both before retrying.
          on_retry_command: |
            pkill -f "^Workhorse .*: $GITHUB_WORKSPACE" || true
            pkill -f "[I]lib:test/lib" || true
            sleep 1
            rm -f tmp/pids/*

  linters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.0.1
          bundler-cache: true
      - name: Run rubocop
        run: bundle exec rubocop
